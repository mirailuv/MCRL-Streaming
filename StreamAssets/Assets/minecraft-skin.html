<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MC Skin Viewer</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323:wght@400&display=swap" rel="stylesheet">
  <style>
    :root {
      --green: #39ff14;
      --dark: #0a0f0a;
      --panel: rgba(10, 20, 10, 0.92);
      --border: #1a3a1a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      background: transparent !important;
      background-color: rgba(0, 0, 0, 0) !important;
      width: 300px;
      height: 600px;
      overflow: hidden;
      font-family: 'Press Start 2P', monospace;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    /* ── Skin display ── */
    #skin-wrap {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 8px;
    }

    #username-tag {
      font-family: 'VT323', monospace;
      font-size: 22px;
      color: #fff;
      text-shadow:
        2px 2px 0 #000,
        -1px -1px 0 #000,
        1px -1px 0 #000,
        -1px 1px 0 #000;
      margin-bottom: 6px;
      letter-spacing: 1px;
      opacity: 0;
      transition: opacity 0.4s;
    }

    #skin-img {
      image-rendering: pixelated;
      width: 180px;
      height: auto;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    #skin-img.loaded {
      opacity: 1;
      transform: translateY(0);
    }

    #username-tag.loaded {
      opacity: 1;
    }

    /* ── Settings panel ── */
    #settings-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 28px;
      height: 28px;
      background: rgba(10,20,10,0.7);
      border: 1px solid #1a3a1a;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, border-color 0.2s;
      z-index: 10;
    }

    #settings-btn:hover {
      background: rgba(57,255,20,0.15);
      border-color: var(--green);
    }

    #settings-btn svg {
      width: 14px;
      height: 14px;
      fill: #6a8a6a;
      transition: fill 0.2s;
    }

    #settings-btn:hover svg { fill: var(--green); }

    #panel {
      position: absolute;
      top: 44px;
      right: 8px;
      background: var(--panel);
      border: 1px solid #1a3a1a;
      border-radius: 6px;
      padding: 16px;
      width: 200px;
      display: none;
      flex-direction: column;
      gap: 10px;
      z-index: 20;
    }

    #panel.open { display: flex; }

    #panel label {
      font-family: 'VT323', monospace;
      font-size: 16px;
      color: #6a8a6a;
      letter-spacing: 1px;
    }

    #panel input {
      background: #0d1a0d;
      border: 1px solid #1a3a1a;
      border-radius: 4px;
      color: var(--green);
      font-family: 'VT323', monospace;
      font-size: 18px;
      padding: 6px 8px;
      outline: none;
      width: 100%;
      letter-spacing: 1px;
      transition: border-color 0.2s;
    }

    #panel input:focus { border-color: var(--green); }

    #panel input::placeholder { color: #2a4a2a; }

    #save-btn {
      background: transparent;
      border: 1px solid var(--green);
      color: var(--green);
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      padding: 8px;
      cursor: pointer;
      border-radius: 4px;
      letter-spacing: 1px;
      transition: background 0.2s, color 0.2s;
    }

    #save-btn:hover {
      background: var(--green);
      color: #000;
    }

    #status {
      font-family: 'VT323', monospace;
      font-size: 15px;
      color: #4a7a4a;
      text-align: center;
      min-height: 18px;
    }

    #status.err { color: #ff4444; }

    /* spinning gear animation */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinning { animation: spin 1s linear infinite; }
  </style>
</head>
<body>

  <div id="skin-wrap">
    <img id="skin-img" alt="MC Skin" />
  </div>

  <button id="settings-btn" title="Settings">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 15.5A3.5 3.5 0 0 1 8.5 12 3.5 3.5 0 0 1 12 8.5a3.5 3.5 0 0 1 3.5 3.5 3.5 3.5 0 0 1-3.5 3.5m7.43-2.92c.04-.34.07-.69.07-1.08s-.03-.74-.07-1.08l2.32-1.8c.21-.16.27-.46.13-.7l-2.2-3.81c-.13-.24-.42-.32-.66-.24l-2.74 1.1c-.57-.44-1.18-.81-1.86-1.08l-.42-2.9C14.32 2.18 14.06 2 13.78 2h-4.4c-.28 0-.54.18-.59.44l-.42 2.9c-.68.27-1.3.64-1.86 1.08L3.77 5.33c-.25-.09-.53 0-.66.24L.91 9.38c-.14.24-.08.54.13.7l2.32 1.8C3.32 12.26 3.29 12.61 3.29 13s.03.74.07 1.08l-2.32 1.8c-.21.16-.27.46-.13.7l2.2 3.81c.13.24.42.32.66.24l2.74-1.1c.57.44 1.18.81 1.86 1.08l.42 2.9c.05.26.31.44.59.44h4.4c.28 0 .54-.18.59-.44l.42-2.9c.68-.27 1.3-.64 1.86-1.08l2.74 1.1c.25.09.53 0 .66-.24l2.2-3.81c.14-.24.08-.54-.13-.7l-2.32-1.8z"/>
    </svg>
  </button>

  <div id="panel">
    <label>PLAYER NAME</label>
    <input id="name-input" type="text" placeholder="Steve" maxlength="16" spellcheck="false" />
    <button id="save-btn">APPLY</button>
    <div id="status"></div>
  </div>

  <script>
    const img       = document.getElementById('skin-img');
    const nameInput = document.getElementById('name-input');
    const saveBtn   = document.getElementById('save-btn');
    const statusEl  = document.getElementById('status');
    const panel     = document.getElementById('panel');
    const gearBtn   = document.getElementById('settings-btn');

    const LS_KEY = 'mc_skin_username';

    function loadSkin(username) {
      if (!username) return;

      img.classList.remove('loaded');
      statusEl.textContent = '';

      // Crafatar needs UUID; mc-heads.net accepts usernames directly
      const url = `https://mc-heads.net/body/${encodeURIComponent(username)}/500`;

      const testImg = new Image();

      testImg.onload = () => {
        img.src = url;
        img.classList.add('loaded');
      };

      testImg.onerror = () => {
        statusEl.textContent = 'Player not found';
        statusEl.className = 'err';
      };

      testImg.src = url;
    }

    function saveAndLoad() {
      const name = nameInput.value.trim();
      if (!name) { statusEl.textContent = 'Enter a name'; statusEl.className = 'err'; return; }
      statusEl.textContent = 'Loading...';
      statusEl.className = '';
      localStorage.setItem(LS_KEY, name);
      loadSkin(name);
      setTimeout(() => { statusEl.textContent = 'Saved ✓'; statusEl.className = ''; }, 600);
    }

    saveBtn.addEventListener('click', saveAndLoad);
    nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') saveAndLoad(); });

    gearBtn.addEventListener('click', () => {
      panel.classList.toggle('open');
    });

    // Close panel if clicking outside
    document.addEventListener('click', e => {
      if (!panel.contains(e.target) && e.target !== gearBtn) {
        panel.classList.remove('open');
      }
    });

    // Init on load
    const saved = localStorage.getItem(LS_KEY);
    if (saved) {
      nameInput.value = saved;
      loadSkin(saved);
    }
  </script>
</body>
</html>
